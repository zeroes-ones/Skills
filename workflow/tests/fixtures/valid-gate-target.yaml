name: valid-gate-target
version: "1.0.0"
description: Gate declared under gates[] is a valid edge target and escalation destination.
start: code-reviewer
nodes:
  - id: code-reviewer
    skill: code-reviewer
gates:
  - id: release-gate
    type: gate
    kind: human
    requires: [code-review-findings]
    description: Human approves the release candidate.
edges:
  - from: code-reviewer
    to: release-gate
    when: code-reviewer.status == done
    payload: handoff-v1
payloads:
  handoff-v1:
    - status
    - summary
    - artifacts
    - decisions
    - open_questions
    - verification_evidence
    - context
    - budget
end: [release-gate]
