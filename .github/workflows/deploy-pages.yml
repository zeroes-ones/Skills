name: Deploy Graph Explorer to GitHub Pages

# Serves the visual skill-chain explorer at https://<owner>.github.io/Skills/
#
# To activate: repo Settings → Pages → Source: "GitHub Actions" (one-time,
# repo-owner action). The workflow publishes only docs/graph-explorer/ so the
# static page (index.html + graph-explorer.js + skill-graph.json) goes live.

on:
  push:
    branches: [main]
    paths:
      - 'docs/graph-explorer/**'
      - 'scripts/emit-skill-graph.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact (explorer only)
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/graph-explorer
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
