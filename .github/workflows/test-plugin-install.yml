name: Test Plugin Install

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - 'scripts/init-project.sh'
      - 'scripts/npx-skills.sh'
      - 'package.json'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.claude/commands/**'
      - '.gemini/commands/**'
      - '.copilot/commands/**'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - 'scripts/init-project.sh'
      - 'scripts/npx-skills.sh'
      - 'package.json'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.github/**'

jobs:
  # Exit criteria EC-1…EC-3 — see docs/install-exit-criteria.md
  test-shell-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check install scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/init-project.sh
          bash -n scripts/npx-skills.sh
      - name: E2E — dual-mode skills-init against the checkout store (PR + push)
        run: |
          set -euo pipefail
          export SKILLS_HOME="$GITHUB_WORKSPACE"   # checkout layout == store layout
          PROJ="$RUNNER_TEMP/e2e-local"
          rm -rf "$PROJ"; mkdir -p "$PROJ"; cd "$PROJ"
          bash "$GITHUB_WORKSPACE/scripts/init-project.sh" > /dev/null
          test "$(find -L .agents/skills -name SKILL.md | wc -l | tr -d ' ')" = "298"
          bash "$GITHUB_WORKSPACE/scripts/init-project.sh" --solo > /dev/null
          test "$(find -L .agents/skills -name SKILL.md | wc -l | tr -d ' ')" = "8"
          bash "$GITHUB_WORKSPACE/scripts/init-project.sh" --grow > /dev/null
          test "$(find -L .claude/skills -name SKILL.md | wc -l | tr -d ' ')" = "18"
          bash "$GITHUB_WORKSPACE/scripts/init-project.sh" --status | grep -q "grow"
          bash "$GITHUB_WORKSPACE/scripts/init-project.sh" > /dev/null
          test -L .agents/skills
          test "$(find -L .agents/skills -name SKILL.md | wc -l | tr -d ' ')" = "298"
          echo "✓ dual-mode skills-init: 298 default / 8 solo / 18 grow / mode switching OK"
      - name: E2E — fresh shell install from GitHub (push to main only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/e2e-home"
          rm -rf "$HOME"; mkdir -p "$HOME"
          bash "$GITHUB_WORKSPACE/scripts/install.sh"
          test -d "$HOME/.zeroes-ones/skills"
          test "$(find "$HOME/.zeroes-ones/skills/skills" -name SKILL.md | wc -l | tr -d ' ')" = "298"
          test "$(find "$HOME/.zeroes-ones/skills/skills-flat" -maxdepth 1 -mindepth 1 | wc -l | tr -d ' ')" = "298"
          test -L "$HOME/.claude/skills"
          test -x "$HOME/.local/bin/skills-init"
          PROJ="$RUNNER_TEMP/e2e-remote-proj"
          rm -rf "$PROJ"; mkdir -p "$PROJ"; cd "$PROJ"
          "$HOME/.local/bin/skills-init" --solo > /dev/null
          test "$(find -L .agents/skills -name SKILL.md | wc -l | tr -d ' ')" = "8"
          "$HOME/.local/bin/skills-init" > /dev/null
          test "$(find -L .claude/skills -name SKILL.md | wc -l | tr -d ' ')" = "298"
          echo "✓ fresh install from GitHub: 298 skills, agent symlinks, dual-mode skills-init"

  # Exit criteria EC-4…EC-5 — see docs/install-exit-criteria.md
  test-npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate package.json + bin scripts exist
        run: |
          node -e "const p = require('./package.json'); if (!p.bin.skills) throw new Error('bin.skills missing'); console.log('Package:', p.name, p.version); console.log('Bins:', Object.keys(p.bin).join(', '));"
          for bin in skills skills-init skills-update skills-validate skills-lint; do
            script=$(node -e "console.log(require('./package.json').bin['$bin'])")
            test -f "$script" || { echo "ERROR: $script not found for $bin"; exit 1; }
            echo "✓ $bin → $script"
          done
      - name: Pack tarball and verify contents
        run: |
          set -euo pipefail
          TGZ=$(npm pack --silent | tail -1)
          echo "tarball: $TGZ"
          tar tzf "$TGZ" > "$RUNNER_TEMP/tarball.list"
          for entry in package/scripts/init-project.sh package/scripts/npx-skills.sh package/scripts/install.sh package/docs/install-exit-criteria.md package/package.json; do
            grep -q "^$entry$" "$RUNNER_TEMP/tarball.list" || { echo "ERROR: $entry missing from tarball"; exit 1; }
            echo "✓ $entry"
          done
      - name: Skills bin dispatches from the packed tarball
        run: |
          set -euo pipefail
          TGZ=$(npm pack --silent | tail -1)
          npm install --prefix "$RUNNER_TEMP/npmtest" --no-save --no-package-lock --no-audit --no-fund "$TGZ" > /dev/null
          "$RUNNER_TEMP/npmtest/node_modules/.bin/skills" --help > "$RUNNER_TEMP/skills-help.txt"
          grep -q "init" "$RUNNER_TEMP/skills-help.txt"
          "$RUNNER_TEMP/npmtest/node_modules/.bin/skills" init --help > "$RUNNER_TEMP/skills-init-help.txt"
          grep -q -- "--solo" "$RUNNER_TEMP/skills-init-help.txt"
          echo "✓ installed package exposes 'skills' bin; dispatcher routes init (literal 'npx @zeroes-ones/skills init' verified by exit-criteria gate EC-7 post-publish)"

  test-command-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate command parity
        run: node scripts/validate-commands.js

  test-plugin-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin JSON files
        run: |
          for f in .claude-plugin/marketplace.json .claude-plugin/plugin.json .cursor-plugin/marketplace.json; do
            if [ -f "$f" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$f','utf-8')); console.log('✓ $f valid')"
            fi
          done
      - name: Validate hooks.json
        run: |
          if [ -f hooks/hooks.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json','utf-8')); console.log('✓ hooks/hooks.json valid')"
          fi

  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        run: |
          chmod +x hooks/*.sh
          bash hooks/session-start-test.sh
          bash hooks/simplify-ignore-test.sh
