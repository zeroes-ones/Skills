name: Skills Governance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'skills/**/references/*.md'
      - 'scripts/validate-skills.sh'
      - 'scripts/validate_chains.py'
      - 'scripts/lib/lint-template.py'
      - 'scripts/emit-skill-graph.py'
      - 'docs/graph-explorer/**'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'skills/**/references/*.md'
      - 'scripts/validate-skills.sh'
      - 'scripts/validate_chains.py'
      - 'scripts/lib/lint-template.py'
      - 'scripts/emit-skill-graph.py'
      - 'docs/graph-explorer/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Skills
        id: validate
        run: bash scripts/validate-skills.sh

      - name: Chain Symmetry
        id: chain
        continue-on-error: true
        run: python3 scripts/validate_chains.py

      - name: Token Budget Report
        if: always()
        run: |
          echo "## Token Budget Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import os, re
          for root, _, files in os.walk('skills'):
              for f in files:
                  if f == 'SKILL.md':
                      path = os.path.join(root, f)
                      with open(path) as fh:
                          content = fh.read()
                      parts = re.split(r'^---\s*$', content, maxsplit=2, flags=re.MULTILINE)
                      if len(parts) < 3:
                          continue
                      words = len(parts[2].split())
                      status = '✅' if words <= 5000 else '⚠️'
                      print(f'{status} **{words}** words — `{path}`')
          " >> $GITHUB_STEP_SUMMARY

      - name: PR Comment
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const body = `## ⚠️ Skills Governance Gate Failed

            The automated validation checks found issues with one or more skill files.
            Please check the [workflow run](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.

            **Common fixes:**
            - Frontmatter: ensure \`---\` delimiters are exactly 3 dashes, \`token_budget\` field present
            - Descriptions: must include "Use when..." and "Handles..."
            - All 22 core sections must be present (see \`scripts/references/10-10-template.md\`)
            - Reference links must point to existing files
            - Chain references must be bidirectional (A feeds_into B → B consumes_from A)
            - Error Decoder, Best Practices, Production Checklist sections required
            - At least 3 QUICK markers for progressive disclosure
            - SKILL.md body must be under 5000 words`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify hooks are installable
        run: |
          chmod +x .githooks/pre-commit .githooks/pre-push scripts/install-hooks.sh
          bash scripts/install-hooks.sh
          bash .githooks/pre-commit
          echo "✅ Hooks verified"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: 'skills/**/SKILL.md'
          config: .markdownlint.json

      - name: Link Check
        run: |
          errors=0
          while IFS= read -r line; do
            ref_file=$(echo "$line" | grep -oP '(?<=\(\.\/references\/)[^)]+')
            dir=$(echo "$line" | cut -d: -f1 | xargs dirname)
            if [ ! -f "$dir/references/$ref_file" ]; then
              echo "❌ BROKEN: $dir/references/$ref_file (from $line)"
              errors=1
            fi
          done < <(grep -roPH '\[.*\]\(\.\/references\/[^)]+\)' skills/ 2>/dev/null || true)
          exit $errors

  graph-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Explorer outputs are fresh
        run: python3 scripts/emit-skill-graph.py --check

  workflow-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Workflow validation + loop-engine self-tests
        run: |
          python3 scripts/validate-workflows.py --selftest
          python3 scripts/validate-workflows.py --all
          python3 scripts/workflow-runner.py --selftest

      - name: Golden skill evals
        run: bash scripts/eval-skill.sh --all

      - name: Dogfood — repo self-check runs as a graph
        run: |
          python3 scripts/workflow-runner.py \
            --manifest workflow/manifests/repo-self-check.yaml \
            --executor scripts/executors/repo_checks.py \
            --state /tmp/repo-state.json --memory /tmp/repo-memory
          spans=$(python3 scripts/export-traces.py --state /tmp/repo-state.json | wc -l)
          echo "## Repo Self-Check (workflow-graphs job)" >> $GITHUB_STEP_SUMMARY
          echo "trace spans: $spans" >> $GITHUB_STEP_SUMMARY

      - name: Measured baseline (informational)
        run: python3 scripts/benchmark-skills.py --root skills --markdown
