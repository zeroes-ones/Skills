name: production-incident
version: "1.0.0"
description: "Real-world on-call firefight: an alert for a payments checkout outage is triaged, a bounded stabilize loop (fix <-> telemetry) tries bounded mitigations, exhaustion first escalates to a kind: agent gate that picks the corrective channel, and a human incident-commander gate owns the final call (declare/rollback)."
payloads:
  handoff-v1:
    - status
    - summary
    - artifacts
    - decisions
    - open_questions
    - verification_evidence
    - context
    - budget
    - next
budget:
  max_steps: 60
start: triage
nodes:
  - id: triage
    skill: incident-responder
    outputs: [incident-report]
  - id: fix
    skill: backend-developer
    inputs: [incident-report]
    outputs: [fix-attempt]
  - id: telemetry
    skill: observability-engineer
    inputs: [incident-report, fix-attempt]
    outputs: [status-report]
gates:
  - id: identify-agent-gate
    type: gate
    kind: agent
    pool: [fix, telemetry]
    max_reroutes: 3
    escalate_to: commander-gate
    requires: [incident-report, status-report]
    description: "Pre-human triage: on stabilize-loop exhaustion, pick the channel (fix or telemetry) that leads the next bounded window; reroutes are bounded, and a no-delta window escalates to the incident commander."
  - id: commander-gate
    type: gate
    kind: human
    requires: [incident-report, status-report]
    description: "Human incident commander owns the final call: confirm stabilization or decide rollback / severity declaration."
edges:
  - from: triage
    to: fix
    when: triage.status == done
    payload: handoff-v1
  - from: telemetry
    to: commander-gate
    when: telemetry.status == done
    payload: handoff-v1
loops:
  - id: stabilize-loop
    nodes: [fix, telemetry]
    exit_when: telemetry.verdict == green
    max_iterations: 2
    escalate_to: identify-agent-gate
    convergence:
      window: 2
      require_delta: true
end: [commander-gate]
