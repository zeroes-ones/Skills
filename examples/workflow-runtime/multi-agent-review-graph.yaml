name: multi-agent-review-graph
version: "1.0.0"
description: "Flagship multi-agent example: three specialist reviewers fan out over a change, an aggregate verdict node decides pass/fail, a fixer node acts on findings, and the review-fix cycle runs as a bounded loop that escalates to a human release gate at exhaustion. See examples/workflow-runtime/README.md."
payloads:
  handoff-v1:
    - status
    - summary
    - artifacts
    - decisions
    - open_questions
    - verification_evidence
    - context
    - budget
    - next
start: code-reviewer
nodes:
  - id: code-reviewer
    skill: code-reviewer
    outputs: [code-findings]
    max_iterations: 1
  - id: security-reviewer
    skill: security-reviewer
    outputs: [security-findings]
    max_iterations: 1
  - id: qa-engineer
    skill: qa-engineer
    outputs: [qa-findings]
    max_iterations: 1
  - id: review-verdict
    skill: multi-agent-orchestration
    outputs: [review-verdict]
    max_iterations: 1
  - id: fixer
    skill: backend-developer
    inputs: [code-findings, security-findings, qa-findings, review-verdict]
    outputs: [fix-report]
    max_iterations: 1
gates:
  - id: release-gate
    type: gate
    kind: human
    requires: [fix-report, review-verdict]
    description: Human approves the change after the review-fix loop converges or exhausts.
parallel:
  - id: reviewers
    nodes: [code-reviewer, security-reviewer, qa-engineer]
    join: all
    outputs: [review-findings]
edges:
  - from: code-reviewer
    to: fixer
    when: code-reviewer.status == done
    payload: handoff-v1
  - from: security-reviewer
    to: fixer
    when: security-reviewer.status == done
    payload: handoff-v1
  - from: qa-engineer
    to: fixer
    when: qa-engineer.status == done
    payload: handoff-v1
  - from: fixer
    to: release-gate
    when: fixer.status == done
    payload: handoff-v1
loops:
  - id: review-fix-loop
    nodes: [code-reviewer, security-reviewer, qa-engineer, review-verdict, fixer]
    exit_when: review-verdict.verdict == pass
    max_iterations: 3
    escalate_to: release-gate
    convergence:
      window: 2
      require_delta: true
end: [release-gate]
